# pnpm settings (pnpm 11+ no longer reads the "pnpm" field in package.json)

# Security overrides for transitive dependencies
overrides:
  'file-type@>=17.0.0 <17.1.3': '>=17.1.3'
  'sharp@<0.30.5': '>=0.30.5'

# Dependencies whose install scripts stay disabled (pnpm 12 fails the install
# when a build script is neither allowed nor explicitly denied)
allowBuilds:
  esbuild: false
  sharp: false
  vue-demi: false

# Local fixes to dependencies, applied only in this repository (consumers never get them).
# @astrojs/vue: the editor integration that `astro check` uses to type .vue files cut a
# runtime-object `defineProps({...})` at its first ")" and stripped "//..." out of strings,
# so four components re-exported from index.ts had no default export and SlimBanner's props
# were half-typed. tests/unit/vue-tsx.test.ts checks the generated TSX of every component.
# Drop the patch once upstream extracts the call correctly; `pnpm install` fails if a new
# @astrojs/vue release no longer applies it.
patchedDependencies:
  '@astrojs/vue': patches/@astrojs__vue.patch
