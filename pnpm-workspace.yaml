# pnpm settings (pnpm 11+ no longer reads the "pnpm" field in package.json)

# Security overrides for transitive dependencies
overrides:
  'file-type@>=17.0.0 <17.1.3': '>=17.1.3'
  'sharp@<0.30.5': '>=0.30.5'

# Dependencies whose install scripts stay disabled (pnpm 12 fails the install
# when a build script is neither allowed nor explicitly denied)
allowBuilds:
  esbuild: false
  sharp: false
  vue-demi: false
