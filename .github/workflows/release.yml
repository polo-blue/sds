name: Release

on:
  push:
    branches:
      - main
      - next
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      # registry-url is deliberately absent. It makes setup-node write an
      # .npmrc auth line that expands to an empty token once NPM_TOKEN is gone;
      # npm reads that as "auth is already configured" and never starts the
      # OIDC exchange, failing with ENEEDAUTH or E404. The publish registry
      # comes from publishConfig in package.json, so the option was only ever
      # writing that line. See actions/setup-node#1551, npm/documentation#1960.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      # npm auth comes from the trusted publisher configured for
      # spoko-design-system on npmjs.com: @semantic-release/npm exchanges the
      # Actions OIDC token (id-token: write, above) for a short-lived
      # credential. No NPM_TOKEN here - a long-lived token is exactly what
      # expired on 2026-06-17 and stalled the 2.1.0 release.
      # Node 24 ships npm 11.19.0, past the 11.5.1 trusted-publishing minimum.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release